<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Yang Store</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

<h1 class="text-center mb-4">Yang Store</h1>

<!-- Buscador -->
<form method="GET" class="mb-4">
<div class="input-group">
<input type="text" name="buscar" class="form-control" placeholder="Buscar productos...">
<button class="btn btn-primary">Buscar</button>
</div>
</form>

<!-- Productos -->
<div class="row">

{% for producto in productos %}

<div class="col-md-4 col-lg-3 mb-4">

<div class="card h-100 shadow-sm">

<img src="{{ producto.foto }}" class="card-img-top" alt="{{ producto.titulo }}">

<div class="card-body text-center">

<h5 class="card-title">{{ producto.titulo }}</h5>

<p class="text-success fw-bold">$ {{ producto.precio }}</p>

<button class="btn btn-outline-primary btn-sm">
Ver producto
</button>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
