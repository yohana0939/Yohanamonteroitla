<div class="col-sm-6 col-lg-4 col-xl-3">
    <div class="card producto-card h-100">
        <a href="{{ url_for('main.producto_detalle', producto_id=producto.id) }}">
            <img src="{{ url_for('static', filename='img/' + producto.imagen) }}" class="card-img-top producto-img" alt="{{ producto.titulo }}">
        </a>
        <div class="card-body d-flex flex-column">
            <span class="badge badge-categoria mb-2 align-self-start">{{ producto.categoria }}</span>
            <h3 class="h6 card-title">
                <a href="{{ url_for('main.producto_detalle', producto_id=producto.id) }}" class="text-decoration-none text-reset">{{ producto.titulo }}</a>
            </h3>
            <p class="text-muted small flex-grow-1">{{ producto.detalle }}</p>
            <span class="fw-bold fs-5 text-price mb-2">${{ "%.2f"|format(producto.precio) }}</span>
            <form method="POST" action="{{ url_for('cart.agregar', producto_id=producto.id) }}">
                <input type="hidden" name="cantidad" value="1">
                <button class="btn btn-accent w-100 btn-sm" type="submit" {% if producto.stock <= 0 %}disabled{% endif %}>
                    {% if producto.stock > 0 %}Agregar al carrito{% else %}Agotado{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
