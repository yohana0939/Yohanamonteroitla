{% extends "admin/layout.html" %}
{% block title %}{{ 'Editar producto' if producto else 'Nuevo producto' }} — Admin{% endblock %}
{% block admin_content %}

<h1 class="h3 mb-4">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h1>

<form method="POST" class="row g-3" style="max-width:640px">
    <div class="col-12">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" value="{{ valores.titulo }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" min="0" name="precio" class="form-control" value="{{ valores.precio }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Stock</label>
        <input type="number" min="0" name="stock" class="form-control" value="{{ valores.stock }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <input type="text" name="categoria" class="form-control" value="{{ valores.categoria }}" list="lista-categorias" required>
        <datalist id="lista-categorias">
            {% for cat in categorias %}
            <option value="{{ cat }}"></option>
            {% endfor %}
        </datalist>
    </div>
    <div class="col-md-6">
        <label class="form-label">Ilustración</label>
        <select name="imagen" class="form-select">
            {% for img in imagenes %}
            <option value="{{ img }}" {% if valores.imagen == img %}selected{% endif %}>{{ img }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea name="detalle" class="form-control" rows="3" required>{{ valores.detalle }}</textarea>
    </div>
    <div class="col-12 d-flex gap-2 mt-2">
        <button class="btn btn-accent">Guardar</button>
        <a href="{{ url_for('admin.productos') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

{% endblock %}
