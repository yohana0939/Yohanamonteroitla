{% extends "admin/layout.html" %}
{% block title %}Usuarios — Admin{% endblock %}
{% block admin_content %}

<h1 class="h3 mb-4">Usuarios</h1>

<div class="table-responsive">
    <table class="table align-middle">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.email }}</td>
                <td><span class="badge-categoria">{{ usuario.rol }}</span></td>
                <td class="text-end">
                    <form method="POST" action="{{ url_for('admin.usuario_rol', user_id=usuario.id) }}" class="d-flex gap-2 justify-content-end">
                        <select name="rol" class="form-select form-select-sm" style="max-width:160px" {% if usuario.id == current_user.id %}disabled{% endif %}>
                            {% for rol in roles %}
                            <option value="{{ rol }}" {% if rol == usuario.rol %}selected{% endif %}>{{ rol|capitalize }}</option>
                            {% endfor %}
                        </select>
                        <button class="btn btn-outline-secondary btn-sm" {% if usuario.id == current_user.id %}disabled{% endif %}>Guardar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
