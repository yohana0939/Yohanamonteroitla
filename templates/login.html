{% extends "base.html" %}
{% block title %}Iniciar sesión — Yangh Store{% endblock %}
{% block content %}

<div class="auth-wrap">
    <div class="auth-card">
        <h2 class="mb-4 text-center">Iniciar sesión</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>
            <div class="d-grid">
                <button class="btn btn-accent">Iniciar sesión</button>
            </div>
            <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
        </form>
    </div>
</div>

{% endblock %}
