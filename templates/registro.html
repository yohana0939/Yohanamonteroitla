{% extends "base.html" %}
{% block title %}Crear cuenta — Yangh Store{% endblock %}
{% block content %}

<div class="auth-wrap">
    <div class="auth-card">
        <h2 class="mb-4 text-center">Crear cuenta</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" value="{{ nombre or '' }}" placeholder="Ingresa tu nombre" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" value="{{ email or '' }}" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" name="confirmar" class="form-control" placeholder="********" required minlength="6">
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" required id="terminos">
                <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-accent">Registrarse</button>
            </div>
            <p class="text-center mt-3 mb-0">¿Ya tienes una cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
        </form>
    </div>
</div>

{% endblock %}
